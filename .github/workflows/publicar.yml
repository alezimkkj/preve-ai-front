name: Atualizar dados e publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (horario UTC; o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restaurar historico do CEMADEN (cache)
        uses: actions/cache@v4
        with:
          path: .cache
          key: cemaden-hist-${{ github.run_id }}
          restore-keys: cemaden-hist-

      - name: Coletar dados (ANA + CEMADEN) e gerar assets/js/data.js
        env:
          ANA_USUARIO: ${{ secrets.ANA_USUARIO }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
          CEMADEN_EMAIL: ${{ secrets.CEMADEN_EMAIL }}
          CEMADEN_SENHA: ${{ secrets.CEMADEN_SENHA }}
          CEMADEN_TOKEN: ${{ secrets.CEMADEN_TOKEN }}
        run: python scripts/coletar.py

      - name: Montar pasta publica (somente o site)
        run: |
          mkdir _site
          cp *.html _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
